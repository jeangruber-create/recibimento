# Blueprint do Render: servidor único (API Node + Prisma + PostgreSQL, servindo também o front).
# Se renomear o serviço, ajuste CORS_ORIGIN para https://<nome>.onrender.com.
databases:
  - name: adm-recebimentos-db
    databaseName: adm_recebimentos
    user: adm

services:
  - type: web
    name: adm-recebimentos-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: adm-recebimentos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Servidor único: a API entrega o index.html em "/", então origem é a mesma.
      # Ajuste se você renomear o serviço (URL = https://<nome>.onrender.com)
      - key: CORS_ORIGIN
        value: https://adm-recebimentos-api.onrender.com
      - key: TRUST_PROXY
        value: "1"
