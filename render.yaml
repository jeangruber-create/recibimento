# Blueprint do Render: servidor único (web service Node + Prisma) servindo também o front.
# O banco fica no Neon (grátis, sem cartão, não expira) — passo a passo no README §6.
# Se renomear o serviço, ajuste CORS_ORIGIN para https://<nome>.onrender.com.
services:
  - type: web
    name: adm-recebimentos-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # DATABASE_URL (pooler) e DIRECT_URL (conexao direta, usada pelo prisma migrate)
      # não estão aqui de propósito: cole no painel (Environment) as strings do Neon
      # (`.env.local` gerado por `neon deploy`). O Blueprint não mexe nelas depois.
      - key: JWT_SECRET
        generateValue: true
      # Servidor único: a API entrega o index.html em "/" — mesma origem.
      - key: CORS_ORIGIN
        value: https://adm-recebimentos-api.onrender.com
      - key: TRUST_PROXY
        value: "1"
